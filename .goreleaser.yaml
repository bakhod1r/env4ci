version: 2
project_name: env4ci

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/env4ci
    binary: env4ci
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

release:
  header: |
    Install (no Go needed):

    ```sh
    curl -sSfL https://raw.githubusercontent.com/bakhod1r/env4ci/main/install.sh | sh
    ```

    GitHub Actions: `uses: bakhod1r/env4ci@v0` · binaries below, verify with `checksums.txt`.

changelog:
  use: git
  sort: asc
  abbrev: 7
  format: "{{ .SHA }} {{ .Message }}"
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude: ['^docs(\(.+\))?:', '^test(\(.+\))?:', '^chore(\(.+\))?:', '^ci(\(.+\))?:']

# Tap and bucket pushes need a PAT with contents:write on those repos
# (secrets HOMEBREW_TAP_TOKEN / SCOOP_BUCKET_TOKEN). Without it they are skipped.
homebrew_casks:
  - name: env4ci
    repository:
      owner: bakhod1r
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_TOKEN" "" }}'
    skip_upload: '{{ if envOrDefault "HOMEBREW_TAP_TOKEN" "" }}false{{ else }}true{{ end }}'
    homepage: https://bakhod1r.github.io/env4ci/
    description: Sync .env files with GitHub Actions, GitLab CI/CD and HashiCorp Vault
    license: MIT
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/env4ci"]
          end

scoops:
  - name: env4ci
    repository:
      owner: bakhod1r
      name: scoop-bucket
      token: '{{ envOrDefault "SCOOP_BUCKET_TOKEN" "" }}'
    skip_upload: '{{ if envOrDefault "SCOOP_BUCKET_TOKEN" "" }}false{{ else }}true{{ end }}'
    homepage: https://bakhod1r.github.io/env4ci/
    description: Sync .env files with GitHub Actions, GitLab CI/CD and HashiCorp Vault
    license: MIT
