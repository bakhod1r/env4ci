deploy:production:
  stage: deploy
  environment: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^release\//
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
  variables:
    TARGET: prod
  script:
    - deploy --db "$DATABASE_URL" --to $TARGET --log $LOG_LEVEL

deploy:staging:
  stage: deploy
  only: [develop]
  environment:
    name: staging
  script:
    - deploy --db "$DATABASE_URL"
